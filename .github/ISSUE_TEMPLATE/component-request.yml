name: Component request
description: Propose a new component for the library.
body:
  - type: input
    id: component-name
    attributes:
      label: Component name
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Proposed tier
      description: CLAUDE.md defines what each tier may contain.
      options:
        - Atom
        - Molecule
        - Organism
        - Not sure
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: What it does
      description: The job this component performs and where it will be used.
    validations:
      required: true
  - type: textarea
    id: states
    attributes:
      label: States & variants
      description: Hover, disabled, loading, empty… anything a story should cover.
  - type: textarea
    id: reference
    attributes:
      label: Design reference
      description: Figma link, screenshot, or prior art.
