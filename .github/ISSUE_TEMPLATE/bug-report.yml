name: Bug report
description: A component renders or behaves wrong.
body:
  - type: input
    id: component
    attributes:
      label: Component or area
      placeholder: Button, palette tokens, Storybook…
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: Steps, and the Storybook story it reproduces in if there is one.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
