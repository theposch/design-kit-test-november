<div id="boot" aria-hidden="true"><div class="boot-ring"><svg viewBox="0 0 120 120" width="120" height="120"><circle class="br-track" cx="60" cy="60" r="58"/><circle class="br-arc" cx="60" cy="60" r="58" pathLength="100"/></svg><svg class="boot-mark" width="26" height="26" viewBox="0 0 184 184" fill="currentColor" aria-label="Metalab"><path d="M130.964 53.0361L184 70.4775V113.521L130.964 130.964L113.521 184H92L114.769 114.769L184 92L114.769 69.2314L92 0L69.2314 69.2314L0 92L69.2314 114.769L92 184H70.4785L53.0361 130.964L0 113.521V70.4775L53.0361 53.0361L70.4785 0H113.521L130.964 53.0361Z"/></svg></div></div>
<script>
  // a quick ring round the Metalab mark before anything else appears
  (() => {
    const done = () => { document.body.classList.add("booted"); setTimeout(() => document.getElementById("boot")?.remove(), 700); };
    // the ring fills (CSS, ~0.95s), and once the page is ready it retracts out, then everything appears
    const t0 = performance.now(), MIN = 1000;
    const out = () => { document.getElementById("boot")?.classList.add("br-out"); setTimeout(done, 560); };
    const go = () => setTimeout(out, Math.max(0, MIN - (performance.now() - t0)));
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => document.readyState === "complete" ? go() : addEventListener("load", go));
  })();
</script>

<script>
  // pagination. Collapsed, one pill in the middle shows the current screen
  // (its label crossfades as you step through; it never moves). Hover and
  // that pill slides onto the current step while the other steps slide out
  // from the centre; leave and they gather back into it.
  (() => {
    const nav = document.querySelector('.steps');
    const pill = nav.querySelector('.steps-pill'), ghost = nav.querySelector('.steps-hover');
    const chip = nav.querySelector('.steps-chip'), labels = chip.querySelector('.sc-labels');
    const btns = [...nav.querySelectorAll('button[data-step]')], items = [...nav.querySelectorAll('button, .steps-sep')];
    let at = null, pending = null, pendingT = 0, closeT = 0, chipW = 0, hovT = 0;
    const isOpen = () => nav.classList.contains('open');
    const cur = () => btns.find(b => b.getAttribute('aria-current') === 'true');
    // the pill: on the current step when open, the chip's shape when closed
    const placePill = () => {
      const c = cur(); if (!c) return;
      const shift = nav.classList.contains('closing') ? parseFloat(nav.style.getPropertyValue('--open-shift')) || 0 : 0;
      const x = isOpen() ? c.offsetLeft : (nav.offsetWidth - chipW) / 2 - shift, w = isOpen() ? c.offsetWidth : chipW;
      pill.style.transform = `translateX(${x}px)`; pill.style.width = w + 'px';
    };
    // every step's offset from the centre: closed, they sit there, gathered
    const gather = () => {
      const c0 = cur(), mid = c0 ? c0.offsetLeft + c0.offsetWidth / 2 : nav.offsetWidth / 2, ci = btns.indexOf(c0);   // they fold into the current step
      items.forEach(el => {
        const i = btns.includes(el) ? btns.indexOf(el) : btns.length;
        el.style.setProperty('--dx', (mid - (el.offsetLeft + el.offsetWidth / 2)) * .72 + 'px');
        el.style.setProperty('--d', `${Math.abs(i - ci) * 35}ms`);
      });
    };
    // opening: the bar is anchored so the current step lands exactly where the chip was
    // (under the pointer) — the others unfold round it, and nothing new slides under the cursor
    // (the open bar stays centred on the screen; the hover delay keeps a step that slides under the pointer from lighting up at once)
    const anchor = () => nav.style.setProperty('--open-shift', '0px');
    const open = () => { clearTimeout(closeT); if (isOpen() || innerWidth <= 500) return; clearTimeout(unshiftT); nav.classList.remove('closing'); anchor(); gather(); nav.classList.add('open'); placePill(); };   // (on a phone the label is just a label: the arrows step)
    let unshiftT = 0;
    const close = () => { clearTimeout(closeT); closeT = setTimeout(() => {
      clearTimeout(hovT);
      nav.classList.add('closing'); nav.classList.remove('open'); ghost.classList.remove('on'); btns.forEach(x => x.classList.remove('hov')); placePill();
      // once folded, the bar returns to centre in one frame (the pill with it, so it doesn't move on screen)
      clearTimeout(unshiftT); unshiftT = setTimeout(() => { if (isOpen()) return; pill.style.transition = 'none'; nav.classList.remove('closing'); placePill(); pill.offsetWidth; pill.style.transition = ''; }, 480);
    }, 140); };
    chip.addEventListener('pointerenter', open);
    nav.addEventListener('pointerenter', () => isOpen() && open());
    nav.addEventListener('pointerleave', close);
    nav.addEventListener('focusin', open);
    nav.addEventListener('focusout', e => { if (!nav.contains(e.relatedTarget)) close(); });

    const place = (el, b) => { el.style.transform = `translateX(${b.offsetLeft}px)`; el.style.width = b.offsetWidth + 'px'; };
    btns.forEach(b => {
      // the pill moves the moment you click; the screen catches up
      b.addEventListener('click', () => { pending = b.dataset.step; pendingT = performance.now(); show(pending); window.proto.step(pending); });
      // the hover highlight waits a moment before moving, so passing across the steps doesn't flicker
      b.addEventListener('pointerenter', () => {
        clearTimeout(hovT);
        hovT = setTimeout(() => {
          if (!isOpen()) return;
          if (!ghost.classList.contains('on')) { ghost.style.transition = 'none'; place(ghost, b); ghost.offsetWidth; ghost.style.transition = ''; }
          place(ghost, b); ghost.classList.add('on');
          btns.forEach(x => x.classList.toggle('hov', x === b));
        }, ghost.classList.contains('on') ? 90 : 160);
      });
      b.addEventListener('pointerleave', () => clearTimeout(hovT));
    });

    // the chip's label crossfades; its width (and the pill under it) eases to fit
    const setChip = (text, instant) => {
      const old = labels.querySelector('.sc-l.cur');
      if (old && old.textContent === text) return;
      labels.querySelectorAll('.sc-l:not(.cur)').forEach(x => x.remove());
      const el = document.createElement('span'); el.className = 'sc-l'; el.textContent = text;
      labels.appendChild(el);
      const w = el.offsetWidth;
      chipW = w + 28;                                   // padding 14 either side
      if (instant || !old) { labels.style.transition = pill.style.transition = 'none'; }
      labels.style.width = w + 'px';
      if (!isOpen()) placePill();
      if (instant || !old) { labels.offsetWidth; labels.style.transition = pill.style.transition = ''; }
      el.offsetWidth; el.classList.add('cur');
      if (old) { old.classList.remove('cur'); old.classList.add('out'); setTimeout(() => old.remove(), 400); }
    };

    const show = (step, instant) => {
      const c = btns.find(b => b.dataset.step === step);
      if (!c) return false;                            // (a step the bar doesn't hold right now, e.g. mid-swap to modes)
      btns.forEach(b => b.setAttribute('aria-current', b === c));

      const now = window.proto.at();
      // hold a clicked step until the prototype gets there (or 4s pass)
      if (pending) { if (now === pending || performance.now() - pendingT > 4000) pending = null; else return; }
      if (now === at) return;
      const first = at === null;
      if (show(now, first) !== false) at = now;        // (not yet on the bar — mid-swap of sets — so it's tried again next time)
    };
    setInterval(sync, 150); sync(); gather();
    // the bar changes width when Skip intro hides the Intro step: re-centre the pill (no slide) and re-gather
    let wasSkip = document.body.classList.contains('skip-loader');
    new MutationObserver(() => {
      const sk = document.body.classList.contains('skip-loader');
      if (sk === wasSkip) return; wasSkip = sk;
      pill.style.transition = 'none'; gather(); placePill(); pill.offsetWidth; pill.style.transition = '';
    }).observe(document.body, { attributes: true, attributeFilter: ['class'] });
    addEventListener('resize', () => { pill.style.transition = 'none'; gather(); placePill(); pill.offsetWidth; pill.style.transition = ''; });

    let wasZ = false;
    new MutationObserver(() => {

<script>
  // on a phone: pagination dots under the design (tap one, or swipe the
  // design, to change screen) and a fullscreen mode where the design fills
  // the phone, with a small button to come back
  (() => {
    if (document.documentElement.classList.contains('embed')) return;
    const b = document.body, dots = document.querySelector('.m-dots');
    const steps = [...document.querySelectorAll('.steps [data-step]')];
    dots.innerHTML = steps.map(s => `<button data-go="${s.dataset.step}" aria-label="${s.textContent}"><i></i></button>`).join('');
    const ds = [...dots.children];
    ds.forEach(d => d.addEventListener('click', () => document.querySelector(`.steps [data-step="${d.dataset.go}"]`)?.click()));
    setInterval(() => {
      const cur = document.querySelector('.steps [data-step][aria-current="true"]')?.dataset.step;
      ds.forEach(d => { d.classList.toggle('on', d.dataset.go === cur); d.hidden = d.dataset.go === 'loader' && b.classList.contains('skip-loader'); });
    }, 150);
    const full = on => {
      b.classList.toggle('m-full', on);
      try { on ? document.documentElement.requestFullscreen?.() : document.fullscreenElement && document.exitFullscreen(); } catch {}
      dispatchEvent(new Event('resize'));
    };
    document.querySelector('.m-full-btn').addEventListener('click', () => full(true));
    document.querySelector('.m-exit').addEventListener('click', () => full(false));
    addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && b.classList.contains('m-full')) full(false); });
  })();

<script>
  // screen notes: an alternative to the per-element labels — one title and one
  // block of copy for the whole screen, beside the phone (at its foot on a phone).
  // Press and hold the labels switch to swap between the two; a tap still turns labels on and off.
  (() => {
    if (document.documentElement.classList.contains('embed')) return;
    const b = document.body, note = document.querySelector('.screen-note');
    const NOTES = {
      loader:  'Placeholder note goes here.',
      start:   'Placeholder note goes here.',
      article: 'Placeholder note goes here.',
      full:    'Placeholder note goes here.',
      menu:    'Placeholder note goes here.',
      'm-default': 'Placeholder note goes here.',
      'm-loading': 'Placeholder note goes here.',
      'm-empty':   'Placeholder note goes here.',
      'm-error':   'Placeholder note goes here.',
      'm-success': 'Placeholder note goes here.',
    };
    const steps = [...document.querySelectorAll('.steps [data-step]')];
    let at = '';
    const paint = () => {
      const cur = document.querySelector('.steps [data-step][aria-current="true"]') || steps[0];
      const k = cur.dataset.step; if (k === at) return; at = k;
      const shown = steps.filter(x => !(x.dataset.step === 'loader' && b.classList.contains('skip-loader')));
      note.classList.remove('in'); void note.offsetWidth;
      note.querySelector('.sn-k').textContent = `${shown.indexOf(cur) + 1}/${shown.length}`;
      note.querySelector('.sn-t').textContent = cur.textContent;
      note.querySelector('.sn-c').textContent = NOTES[k] || '';
      note.classList.add('in');
    };
    // centred in the space between the left arrow and the phone
    const device = document.querySelector('#device');
    const place = () => {
      if (innerWidth <= 500) { note.style.left = note.style.width = ''; return; }
      // the phone's resting place — not where a drag (or its spring back) has nudged it
      const nudge = parseFloat((device.style.translate || '0').split(' ')[0]) || 0;
      const moving = nudge !== 0 || b.classList.contains('page-drag') || getComputedStyle(device).translate !== 'none' && getComputedStyle(device).translate !== '0px';
      if (moving && note.style.left) return;
      const d = device.getBoundingClientRect(), from = 70, to = d.left - nudge - 24, space = Math.max(0, to - from);
      const w = Math.min(260, Math.max(160, space - 48));
      note.style.width = w + 'px'; note.style.left = Math.round(from + (space - w) / 2) + 'px';
    };
    setInterval(() => { paint(); place(); }, 150); paint(); place(); addEventListener('resize', place);
    let wasShown = false;
    new MutationObserver(() => { const shown = b.classList.contains('notes-on') && b.classList.contains('notes-screen'); if (shown && !wasShown) { at = ''; paint(); } wasShown = shown; }).observe(b, { attributes: true, attributeFilter: ['class'] });

    // press and hold the labels switch: element labels ⇄ screen notes
    const sw = document.querySelector('.notes-switch'), toast = document.querySelector('.toast');
    let t = 0, held = false, allow = false;
    const say = text => { if (!toast) return; toast.textContent = text; toast.classList.remove('on', 'out'); toast.offsetWidth; toast.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => { toast.classList.remove('on'); toast.classList.add('out'); }, 1600); };
    const swap = () => {
      held = true;
      const screen = !b.classList.contains('notes-screen');
      b.classList.toggle('notes-screen', screen);
      sw.classList.toggle('screen-mode', screen);
      if (!b.classList.contains('notes-on')) { allow = true; sw.click(); }   // make sure labels are showing
      at = ''; paint();
      setTimeout(() => say(screen ? 'Screen notes' : 'Element labels'), 20);
      navigator.vibrate?.(12);
    };
    // holding fills the ring round the button; once it's full the mode swaps
    // a quick tap shows nothing: the ring only starts once it's clearly a hold (after 280ms)
    let t0 = 0;
    sw.addEventListener('pointerdown', e => {
      if (e.button > 0) return; held = false; clearTimeout(t); clearTimeout(t0);
      t0 = setTimeout(() => sw.classList.add('holding'), 280);
      t = setTimeout(() => { sw.classList.remove('holding'); sw.classList.add('filled'); setTimeout(() => sw.classList.remove('filled'), 420); swap(); }, 280 + 550);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => sw.addEventListener(ev, () => { clearTimeout(t); clearTimeout(t0); sw.classList.remove('holding'); }));
    sw.addEventListener('contextmenu', e => e.preventDefault());
    // the tap that ends a hold doesn't also switch labels off
    sw.addEventListener('click', e => { if (allow) { allow = false; return; } if (held) { held = false; e.stopImmediatePropagation(); e.preventDefault(); } }, true);
  })();
</script>
<script>
  // UX Design - Modes: one screen whose states the step bar switches between.
  // In modes the bar's buttons read Default · Loading · Empty · Error · Success,
  // and the prototype's step / at answer for the state instead of the flow.
  (() => {
    if (document.documentElement.classList.contains('embed')) return;
    const root = document.documentElement, b = document.body;
    const MODES = [['m-default', 'Mode 1'], ['m-loading', 'Mode 2'], ['m-empty', 'Mode 3'], ['m-error', 'Mode 4'], ['m-success', 'Mode 5']];   // (the states: default, loading, empty, error, success)
    const btns = [...document.querySelectorAll('.steps [data-step]')];
    const flowSteps = btns.map(x => [x.dataset.step, x.textContent]);
    const flow = window.proto;
    let mode = 'm-default';
    const on = () => root.classList.contains('proto-modes');
    const setMode = k => { mode = k; b.dataset.mode = k; };
    window.proto = {
      step: name => on() ? (name.startsWith('m-') && setMode(name)) : flow.step(name),
      at: () => on() ? mode : flow.at(),
    };
    const apply = () => {
      const list = on() ? MODES : flowSteps;
      btns.forEach((x, i) => { x.dataset.step = list[i][0]; x.textContent = list[i][1]; });
      if (on()) { flow.step('start'); setMode('m-default'); }
      dispatchEvent(new Event('resize'));
    };
    addEventListener('proto-set', () => requestAnimationFrame(apply));
    setMode('m-default');
    if (on()) apply();
  })();
</script>

<script>
  // Desktop screens on a phone: the desktop design itself, in a small 16:9 browser window in the
  // middle — the prototype laid out at desktop width in a frame (1280 × 720) and scaled down to fit.
  // The step bar and its arrows drive the screens inside it.
  (() => {
    const root = document.documentElement, b = document.body;
    if (root.classList.contains('embed')) return;
    const W = 1280, H = 720, BAR = 18;
    const box = document.createElement('div');
    box.className = 'm-desk'; box.setAttribute('aria-hidden', 'true');
    box.innerHTML = '<div class="md-win"><iframe title="Desktop screens" tabindex="-1"></iframe></div><div class="md-hit"></div>';
    b.appendChild(box);
    const win = box.querySelector('.md-win'), frame = box.querySelector('iframe');
    const active = () => root.classList.contains('proto-desktop') && innerWidth <= 500;
    const inner = () => { try { return frame.contentWindow.proto; } catch { return null; } };
    let pending = null;
    const flow = window.proto;
    window.proto = {
      step: name => { if (!active()) return flow.step(name); const p = inner(); p ? p.step(name) : (pending = name); },
      at: () => { if (!active()) return flow.at(); const p = inner(); return p ? p.at() : (pending || 'loader'); },
    };
    frame.addEventListener('load', () => { if (pending && inner()) { inner().step(pending); pending = null; } });
    const fit = () => {
      const on = active();
      b.classList.toggle('m-desk-on', on);
      if (!on) { if (frame.src) frame.removeAttribute('src'); return; }
      if (!frame.getAttribute('src')) { pending = pending || 'loader'; frame.src = `index.html?embed&set=${window.PROTO_SET}&b=${Date.now().toString(36)}#${pending}`; }
      const r = box.getBoundingClientRect();
      win.style.setProperty('--mdf', Math.min(r.width / W, (r.height - BAR) / H).toFixed(4));   // (the title bar keeps its own 18px)
    };
    addEventListener('resize', fit);
    addEventListener('proto-set', () => requestAnimationFrame(fit));
    fit();
    // swipe sideways over it to change screen (as the arrows do): the window follows a little, then springs back
    const hit = box.querySelector('.md-hit');
    let d = null;
    hit.addEventListener('pointerdown', e => { d = { x: e.clientX, y: e.clientY, t: e.timeStamp, id: e.pointerId }; hit.setPointerCapture(e.pointerId); win.style.transition = 'none'; });
    hit.addEventListener('pointermove', e => {
      if (!d || e.pointerId !== d.id) return;
      const dx = e.clientX - d.x;
      win.style.translate = `${Math.max(-40, Math.min(40, dx * .35))}px 0`;
    });
    const end = e => {
      if (!d || e.pointerId !== d.id) return;
      const dx = e.clientX - d.x, dy = e.clientY - d.y, v = dx / Math.max(1, e.timeStamp - d.t);
      d = null;
      win.style.transition = 'translate .35s cubic-bezier(.22, 1, .36, 1)'; win.style.translate = '';
      if (Math.abs(dx) > Math.abs(dy) && (Math.abs(dx) > 50 || Math.abs(v) > .5)) document.querySelector(dx < 0 ? '.sa-next' : '.sa-prev')?.click();
    };
    hit.addEventListener('pointerup', end);
    hit.addEventListener('pointercancel', end);
  })();
</script>
<script>
  // the spacebar never re-presses the last clicked button (a step, an arrow, a switch);
  // it hides / shows the UI round the phone instead. Text fields keep it
  (() => {
    const keep = el => /INPUT|TEXTAREA|SELECT/.test(el?.tagName || '') || el?.isContentEditable;
    ['keydown', 'keyup', 'keypress'].forEach(ev => addEventListener(ev, e => {
      if ((e.key === ' ' || e.code === 'Space') && !keep(document.activeElement)) {
        e.preventDefault(); e.stopPropagation();
        // …instead it hides and shows the UI round the phone
        if (ev === 'keydown' && !e.repeat) window.protoToggleUI?.();
      }
    }, true));
  })();
</script>
<script>
  // desktop gallery: a fixed view, so the wheel (or a touch drag) never scrolls the window behind it
  (() => {
    const fs = document.querySelector('.fs-view');
    const stop = e => { if (document.documentElement.classList.contains('proto-desktop') && document.body.classList.contains('fs-open')) e.preventDefault(); };
    fs.addEventListener('wheel', stop, { passive: false });
    fs.addEventListener('touchmove', stop, { passive: false });
  })();
